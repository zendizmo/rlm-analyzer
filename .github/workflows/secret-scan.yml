# bzlabs cross-repo secret scanner
#
# Drop this into each BzLabs repo at `.github/workflows/secret-scan.yml`.
#
# Why a CI version when we already have local pre-commit + pre-push hooks?
#   - Catches `git push --no-verify` bypasses
#   - Catches commits from contributors who haven't installed core.hooksPath
#   - Catches force-pushed history rewrites that local hooks ran against
#     a smaller range
#   - Reports show up on PRs as required checks if you configure branch
#     protection to require this job to pass
#
# Patterns + allowlist must stay in sync with
# ~/dev/Projects/BZLabs/.security/hooks/{pre-commit,pre-push}.
#
# To migrate to a centralized reusable workflow later: move this file to
# zendizmo/.github/.github/workflows/secret-scan.yml and replace this file
# in each repo with a one-line `uses:`.

name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # required to leave a comment on the PR on failure

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to walk push ranges + diffs

      - name: Determine commit range
        id: range
        run: |
          ZERO='0000000000000000000000000000000000000000'
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
            echo "range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
            echo "label=PR #${{ github.event.pull_request.number }} (${BASE:0:7}..${HEAD:0:7})" >> "$GITHUB_OUTPUT"
          else
            BEFORE='${{ github.event.before }}'
            AFTER='${{ github.event.after }}'
            if [ "$BEFORE" = "$ZERO" ]; then
              # New branch — diff against the default branch
              git fetch origin "$DEFAULT_BRANCH" --quiet || true
              echo "range=origin/${DEFAULT_BRANCH}..${AFTER}" >> "$GITHUB_OUTPUT"
              echo "label=new branch '${{ github.ref_name }}' vs ${DEFAULT_BRANCH} (..${AFTER:0:7})" >> "$GITHUB_OUTPUT"
            else
              echo "range=${BEFORE}..${AFTER}" >> "$GITHUB_OUTPUT"
              echo "label=push to ${{ github.ref_name }} (${BEFORE:0:7}..${AFTER:0:7})" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan commit range for secrets
        id: scan
        env:
          RANGE: ${{ steps.range.outputs.range }}
          LABEL: ${{ steps.range.outputs.label }}
        run: |
          set -u

          KEY_PATTERNS='AIza[A-Za-z0-9_-]{35}|sk-[A-Za-z0-9_-]{40,}|sk-proj-[A-Za-z0-9_-]{30,}|sk-ant-[A-Za-z0-9_-]{30,}|sk-svcacct-[A-Za-z0-9_-]{30,}|sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{30,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|"type":[[:space:]]*"service_account"'
          ALLOWED_PUBLIC='(VITE|NEXT_PUBLIC|REACT_APP)_(FIREBASE_API_KEY|FIREBASE_AUTH_DOMAIN|FIREBASE_PROJECT_ID|FIREBASE_STORAGE_BUCKET|FIREBASE_MESSAGING_SENDER_ID|FIREBASE_APP_ID|FIREBASE_MEASUREMENT_ID|FIREBASE_DATABASE_URL|STRIPE_PUBLIC_KEY|STRIPE_PUBLISHABLE_KEY|SUPABASE_URL|SUPABASE_ANON_KEY|MAPBOX_PUBLIC_TOKEN|MAPBOX_TOKEN|POSTHOG_KEY|POSTHOG_HOST|SENTRY_DSN|GA_MEASUREMENT_ID|GOOGLE_ANALYTICS_ID|APP_ID|API_URL|API_BASE_URL|SITE_URL|NEON_AUTH_BASE_URL|CLIENT_ID|TWITTER_CLIENT_ID|FACEBOOK_APP_ID|INSTAGRAM_CLIENT_ID|LINKEDIN_CLIENT_ID)'
          DANGER_VARS='(VITE|NEXT_PUBLIC|REACT_APP)_[A-Z_]*(SECRET|PRIVATE|GEMINI|OPENAI|ANTHROPIC|CLAUDE|BEDROCK|SENDGRID|TWILIO|STRIPE_SECRET|SUPABASE_SERVICE|ADMIN_PASSWORD|SERVICE_ROLE|WEBHOOK_SECRET|API_KEY)'

          echo "::group::Range: $LABEL"
          echo "Scanning commit range: $RANGE"

          # Verify the range is resolvable (race vs. force-push)
          if ! git rev-list "$RANGE" >/dev/null 2>&1; then
            echo "::warning ::Could not resolve range '$RANGE' — likely a force-push race. Skipping."
            echo "::endgroup::"
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list --count "$RANGE")
          echo "Commits in range: $COMMIT_COUNT"
          echo "::endgroup::"

          # Build a single combined diff of added lines across the range
          ADDED=$(git log --pretty=format: -p "$RANGE" 2>/dev/null | grep -E '^\+[^+]' | sed 's/^\+//')

          if [ -z "$ADDED" ]; then
            echo "✓ No added lines in range."
            exit 0
          fi

          KEY_HITS=$(echo "$ADDED" | grep -oE "$KEY_PATTERNS" | sort -u | head -10 || true)
          VAR_HITS=$(echo "$ADDED" | grep -E "$DANGER_VARS" | grep -vE "$ALLOWED_PUBLIC" | head -10 || true)

          if [ -z "$KEY_HITS" ] && [ -z "$VAR_HITS" ]; then
            echo "✓ No secrets in commit range."
            exit 0
          fi

          # Write a markdown summary that ends up in the job summary tab
          # and is also used as the PR comment body.
          {
            echo "# 🛑 bzlabs-secret-scan: findings"
            echo ""
            echo "**Range:** \`$LABEL\`"
            echo "**Commits scanned:** $COMMIT_COUNT"
            echo ""
            if [ -n "$KEY_HITS" ]; then
              echo "## Live key value patterns"
              echo ""
              echo '```'
              echo "$KEY_HITS"
              echo '```'
              echo ""
            fi
            if [ -n "$VAR_HITS" ]; then
              echo "## Dangerously-named client-bundled env vars"
              echo ""
              echo "These names get inlined into the client bundle (\`VITE_*\` / \`NEXT_PUBLIC_*\` / \`REACT_APP_*\`) at build time and are extractable from the deployed JS via DevTools. If any value is a server-side secret, this is a leak."
              echo ""
              echo '```'
              echo "$VAR_HITS"
              echo '```'
              echo ""
            fi
            echo "## Remediation"
            echo ""
            echo "1. Move server-side values behind Firebase Functions secrets / Vercel env vars without a public prefix"
            echo "2. Rotate any leaked values at their providers"
            echo "3. Scrub from git history with \`git filter-repo\` if any value is in committed history"
            echo "4. If false positive (e.g. a redacted doc example): extend the allowlist in \`.security/hooks/pre-push\` and this workflow"
          } | tee secret-scan-findings.md > "$GITHUB_STEP_SUMMARY"

          exit 1

      - name: Comment on PR with findings
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('secret-scan-findings.md', 'utf8');
            } catch (e) {
              body = '🛑 Secret-scan job failed but findings file is missing. Check the workflow logs.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
